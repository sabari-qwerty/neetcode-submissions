name: Flag Due Reviews
on:
  schedule:
    - cron: '30 21 * * *'   # daily at 03:00 IST (21:30 UTC the day before)
  workflow_dispatch:        # lets you trigger it manually to test

jobs:
  flag-due:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Move due reviews to status:due
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const cycle = require('./.github/scripts/review-cycle.js')({ github, context, core });
            await cycle.flagDueReviews();

name: Track Submission Progress
on:
  push:
    branches: [main]
    paths:
      - 'Data Structures & Algorithms/**/submission-*.py'

jobs:
  track-progress:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can diff against the previous commit

      - name: Get changed submission files
        id: changed
        run: |
          FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'Data Structures & Algorithms/**/submission-*.py')
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update issue per problem
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const cycle = require('./.github/scripts/review-cycle.js')({ github, context, core });

            // "Data Structures & Algorithms/<slug>/submission-N.py" -> unique slugs
            const slugs = [...new Set(
              process.env.CHANGED_FILES.split('\n')
                .map((f) => f.trim().split('/')[1])
                .filter(Boolean)
            )];

            for (const slug of slugs) {
              await cycle.recordSubmission(slug);
            }

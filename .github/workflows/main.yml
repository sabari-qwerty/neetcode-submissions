name: Track Submission Progress
on:
  push:
    branches: [main]
    paths:
      - 'Data Structures & Algorithms/**/submission-*.py'

jobs:
  track-progress:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can diff against the previous commit

      - name: Get changed submission files
        id: changed
        run: |
          FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'Data Structures & Algorithms/**/submission-*.py')
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update issue per problem
        uses: actions/github-script@v7
        with:
          script: |
                  const {payload} = context
                  const {head_commit} = payload
                  
                  
                  const {message} = head_commit
                  
                  const [problem, submission] = message.split(":")[1].trim().split(" - ")
                  
                  const submission_count = submission.split("-")[1]
                  
              
                  const neetcode_url = `https://neetcode.io/problems/${problem.trim().toLowerCase().replace(/\s+/g, '-')}/question`

                  const title = ({problemName, repited}) => `${problemName}`

                  const searchIssue = async ({title}) => await github.graphql(`query($searchQuery: String!) {
                        search(query: $searchQuery, type: ISSUE, first: 10) {
                          nodes {
                            ... on Issue {
                              id
                              number
                              title
                              state
                              url
                            }
                          }
                        }
                      }  `, { searchQuery: `repo:/sabari-qwerty/neetcode-submissions in:title "${title}"` })
                      )
                      
                  const searchResults = await searchIssue({title: problem})

                  console.log(problem)

                  console.log(JSON.stringify(searchResults, null, 2))

                  
